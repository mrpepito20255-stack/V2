name: Linux Terminal

on:
  workflow_dispatch:

jobs:
  secure-linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600
    steps:
      - name: Install XFCE Desktop and XRDP Server
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          
          # Configuramos XRDP para que use XFCE por defecto
          echo "xfce4-session" > ~/.xsession
          sudo sed -i.bak '/fi/a xfce4-session' /etc/xrdp/startwm.sh
          
          # Reiniciamos el servicio XRDP
          sudo systemctl restart xrdp

      - name: Create Secure Desktop User
        run: |
          PASSWORD=$(openssl rand -base64 12)
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-linux-rdp-$GITHUB_RUN_ID
          
          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Error: Tailscale IP not assigned."
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP assigned: $TS_IP"

      - name: Verify RDP Port
        run: |
          nc -zvw3 localhost 3389 || exit 1
          echo "RDP Port 3389 is active and listening!"

      - name: Maintain Connection
        run: |
          echo "=== LINUX RDP ACCESS ==="
          echo "Address (IP): ${{ env.TAILSCALE_IP }}"
          echo "Username: rdpuser"
          echo "Password: ${{ env.RDP_PASSWORD }}"
          echo "========================"
          
          while true; do
            echo "[$(date)] Linux RDP Active - Use GitHub Actions UI to cancel."
            sleep 300
          done
